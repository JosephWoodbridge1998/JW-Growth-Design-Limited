<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>See Our Work | JW Growth & Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#05070a;
  --black-2:#0a0d12;
  --panel:#0d1117;
  --panel-2:#11161d;
  --neon:#00eaff;
  --neon-2:#4fc3ff;
  --neon-glow: 0 0 22px rgba(0,234,255,0.65);
  --text:#f2f6f9;
  --muted:#93a1b0;
  --line:#1b212b;
  --shadow: 0 30px 70px -30px rgba(0,234,255,0.2);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Manrope',sans-serif;background:var(--black);color:var(--text);overflow-x:hidden;}
h1,h2,h3,.font-display{font-family:'Sora',sans-serif;}
a{text-decoration:none;color:inherit;}
img{max-width:100%;display:block;}
.container{max-width:1220px;margin:0 auto;padding:0 24px;}
::selection{background:var(--neon); color:#000;}
a:hover, .hoverlink:hover{color:var(--neon); filter:drop-shadow(0 0 6px rgba(0,234,255,0.6));}

.reveal{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-40px);transition:opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1);}
.reveal-left.visible{opacity:1;transform:translateX(0);}
.reveal-right{opacity:0;transform:translateX(40px);transition:opacity .8s ease, transform .8s cubic-bezier(.16,1,.3,1);}
.reveal-right.visible{opacity:1;transform:translateX(0);}
.reveal-scale{opacity:0;transform:scale(.9);transition:opacity .7s ease, transform .7s cubic-bezier(.16,1,.3,1);}
.reveal-scale.visible{opacity:1;transform:scale(1);}

header{
  position:fixed; top:0; left:0; right:0; z-index:1000;
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 5%;
  background:rgba(5,7,10,0.0);
  transition: background .4s ease, box-shadow .4s ease, padding .4s ease, border-color .4s ease;
  border-bottom:1px solid transparent;
}
header.scrolled{ background:rgba(5,7,10,0.9); backdrop-filter: blur(14px); padding:14px 5%; border-bottom:1px solid var(--line); }
.brand{display:flex; align-items:center; gap:12px;}
.brand .mark{
  width:42px;height:42px;border-radius:10px; background:linear-gradient(145deg, #0d1117, #05070a);
  border:1px solid var(--line); display:flex;align-items:center;justify-content:center; position:relative; overflow:hidden;
}
.brand .mark::before{ content:''; position:absolute; inset:0; background:conic-gradient(from 200deg, var(--neon), transparent 40%); opacity:.55; animation:spinMark 6s linear infinite; }
@keyframes spinMark{to{transform:rotate(360deg);}}
.brand .mark span{position:relative; z-index:1; font-family:'Sora',sans-serif; font-weight:800; color:var(--neon); font-size:16px; letter-spacing:-1px;}
.brand .name{font-family:'Sora',sans-serif; font-weight:700; font-size:18px; letter-spacing:-0.3px;}
.brand .name em{font-style:normal; color:var(--neon);}
nav ul{display:flex; gap:30px; list-style:none;}
nav a{font-size:14px; font-weight:500; color:var(--text); position:relative; padding-bottom:4px; letter-spacing:.2px;}
nav a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--neon); box-shadow:var(--neon-glow); transition:width .3s ease;}
nav a:hover::after{width:100%;}
nav a.active{color:var(--neon);}
nav a.active::after{width:100%;}
.nav-cta .btn{font-size:13.5px; padding:11px 22px;}
.burger{display:none; flex-direction:column; gap:5px; cursor:pointer; z-index:1100;}
.burger span{width:24px;height:2px;background:var(--text);border-radius:2px;transition:.3s;}

.btn{
  display:inline-flex; align-items:center; gap:8px; background:transparent; border:1.5px solid var(--neon); color:var(--neon);
  font-weight:600; font-size:14px; padding:13px 28px; border-radius:6px;
  transition: box-shadow .3s ease, background .3s ease, color .3s ease, transform .25s ease; cursor:pointer;
}
.btn:hover{background:var(--neon); color:#04121a; box-shadow:0 0 34px rgba(0,234,255,0.6); transform:translateY(-2px);}
.btn.solid{background:var(--neon); color:#04121a; box-shadow:0 8px 26px -8px rgba(0,234,255,0.65);}
.btn.solid:hover{box-shadow:0 12px 36px -6px rgba(0,234,255,0.9);}
.btn.ghost{border-color:var(--line); color:var(--text);}
.btn.ghost:hover{border-color:var(--neon); color:var(--neon); background:transparent; box-shadow:0 0 22px rgba(0,234,255,0.3);}

.section{padding:110px 0;}
.section-tag{ color:var(--neon); font-weight:600; font-size:12.5px; letter-spacing:2.5px; text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.section-tag::before{content:'';width:24px;height:1.5px;background:var(--neon);}
.section-tag.center{justify-content:center;}
.section-tag.center::after{content:'';width:24px;height:1.5px;background:var(--neon);}
.section-head{max-width:680px; margin-bottom:56px;}
.section-head.center{text-align:center; margin:0 auto 56px;}
.section-head h2{font-size:36px; font-weight:700; line-height:1.25; letter-spacing:-0.5px;}
.section-head p{color:var(--muted); font-size:16px; margin-top:16px; line-height:1.7;}

.why-us{background:var(--black-2); position:relative;}
.why-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
.why-item{ display:flex; gap:18px; padding:26px; border:1px solid var(--line); border-radius:16px; background:var(--panel); transition:border-color .35s ease, transform .35s ease; }
.why-item:hover{border-color:var(--neon); transform:translateX(6px);}
.why-item .ic{ width:44px;height:44px;border-radius:10px; background:rgba(0,234,255,0.1); color:var(--neon); display:flex;align-items:center;justify-content:center; font-size:19px; flex-shrink:0; }
.why-item h4{font-size:16px; font-weight:700; margin-bottom:6px;}
.why-item p{font-size:13.5px; color:var(--muted); line-height:1.6;}

footer{background:var(--black-2); border-top:1px solid var(--line); padding:60px 0 26px; font-size:13.5px; color:var(--muted);}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:40px; padding-bottom:36px; border-bottom:1px solid var(--line); margin-bottom:24px;}
.footer-brand-block .brand{margin-bottom:14px;}
.footer-brand-block p{max-width:280px; line-height:1.65;}
.footer-col h5{color:var(--text); font-size:13.5px; font-weight:700; margin-bottom:16px; letter-spacing:.5px;}
.footer-col ul{list-style:none; display:flex; flex-direction:column; gap:10px;}
.footer-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}

.page-hero{ position:relative; padding:170px 0 90px; overflow:hidden; background:radial-gradient(circle at 80% 20%, rgba(0,234,255,0.12), transparent 55%), linear-gradient(160deg, #0a0d12, #05070a 70%); border-bottom:1px solid var(--line); }
.page-hero .grid-lines{position:absolute; inset:0; background-image:linear-gradient(rgba(0,234,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,234,255,0.06) 1px, transparent 1px); background-size:44px 44px; mask-image:radial-gradient(circle at 70% 30%, black, transparent 75%);}
.breadcrumb{position:relative; z-index:1; font-size:13px; color:var(--muted); margin-bottom:22px;}
.breadcrumb a{color:var(--muted);}
.breadcrumb a:hover{color:var(--neon);}
.breadcrumb .sep{margin:0 8px; color:var(--line);}
.page-hero h1{position:relative; z-index:1; font-size:46px; font-weight:800; letter-spacing:-1px; max-width:750px; line-height:1.15;}
.page-hero p.lead{position:relative; z-index:1; color:var(--muted); font-size:17px; line-height:1.7; max-width:600px; margin-top:20px;}

.cta-strip{ background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:50px; text-align:center; position:relative; overflow:hidden; }
.cta-strip::before{content:''; position:absolute; top:-100px; left:50%; transform:translateX(-50%); width:500px; height:260px; background:radial-gradient(circle, rgba(0,234,255,0.18), transparent 70%);}
.cta-strip h2{position:relative; z-index:1; font-size:30px; font-weight:700; margin-bottom:14px;}
.cta-strip p{position:relative; z-index:1; color:var(--muted); font-size:15px; margin-bottom:28px; max-width:480px; margin-left:auto; margin-right:auto;}
.cta-strip .btn{position:relative; z-index:1;}

.compare-wrap{display:grid; grid-template-columns:1fr 1fr; gap:50px; align-items:start;}
@media (max-width:900px){.compare-wrap{grid-template-columns:1fr;}}
.compare-col{text-align:center;}
.compare-label{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:8px 18px; border-radius:30px; margin-bottom:24px;}
.compare-label.before{color:#ff6b6b; border:1px solid rgba(255,107,107,0.4); background:rgba(255,107,107,0.06);}
.compare-label.after{color:var(--neon); border:1px solid var(--neon); background:rgba(0,234,255,0.06);}

.laptop{ position:relative; width:100%; max-width:480px; margin:0 auto; perspective:1000px; }
.laptop-screen{
  position:relative; width:100%; aspect-ratio:16/10.2; background:#000; border-radius:14px 14px 4px 4px;
  border:10px solid #1a1d22; border-bottom-width:14px; box-shadow:0 40px 80px -30px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.04);
  overflow:hidden;
}
.laptop-screen.glow-after{border-color:#132227; box-shadow:0 40px 90px -25px rgba(0,234,255,0.35), 0 0 0 1px rgba(0,234,255,0.25);}
.laptop-notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:60px; height:10px; background:#1a1d22; border-radius:0 0 8px 8px; z-index:5;}
.laptop-base{ width:112%; margin-left:-6%; height:14px; background:linear-gradient(180deg,#2a2e35,#14161a); border-radius:0 0 10px 10px; position:relative; }
.laptop-base::after{ content:''; position:absolute; left:50%; top:0; transform:translateX(-50%); width:70px; height:5px; background:#0a0b0d; border-radius:0 0 4px 4px; }

.screen-scroll{position:absolute; inset:0; overflow:hidden;}
.mini-site{ position:absolute; top:0; left:0; width:100%; animation:scrollSite 18s ease-in-out infinite; }
