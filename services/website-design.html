<!-- Replace the existing Growth card preview with this block -->
<div class="preview growth-preview">
  <div class="mock dark growth-layout">
    <div class="mock-top">
      <span class="mock-logo">JW GROWTH LAB</span>
      <span class="mock-links">STRATEGY &nbsp; RESULTS</span>
    </div>

    <div class="growth-heading">
      <strong>Turn visibility into momentum.</strong>
      <span>Search performance improving month by month.</span>
    </div>

    <div class="growth-metrics">
      <div class="metric"><b class="count count-search">1,284</b><small>monthly searches</small></div>
      <div class="metric"><b class="count count-visits">842</b><small>website visits</small></div>
      <div class="metric"><b class="count count-enquiries">96</b><small>enquiries</small></div>
    </div>

    <div class="search-title">Google visibility</div>
    <div class="search-bars">
      <div class="search-row"><span>01</span><i class="bar bar-one"></i></div>
      <div class="search-row"><span>02</span><i class="bar bar-two"></i></div>
      <div class="search-row"><span>03</span><i class="bar bar-three"></i></div>
    </div>

    <div class="growth-footer">
      <span class="growth-badge">+42% visibility</span>
      <div class="growth-chart"><svg viewBox="0 0 300 55" preserveAspectRatio="none"><path d="M0 47 C28 45 38 39 62 41 S100 29 126 33 S163 20 190 25 S232 9 300 12"></path></svg></div>
    </div>
  </div>
</div>

<!-- Add these CSS rules inside the existing <style> block -->
<style>
.growth-preview{height:225px}
.growth-heading{margin-top:9px}
.growth-heading strong{display:block;font:800 12px Sora;line-height:1.1;color:#f2f6f9}
.growth-heading span{display:block;color:#a7c6cc;font-size:6px;margin-top:3px}
.growth-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:9px}
.growth-preview .metric{height:39px;padding:5px;border-radius:4px;background:rgba(0,234,255,.11);border:1px solid rgba(0,234,255,.32);font-size:6px;color:#b8d1d6;overflow:hidden}
.growth-preview .metric b{display:block;color:var(--neon);font:800 11px Sora;line-height:1.15}
.growth-preview .metric small{font-size:5.5px;color:#b8d1d6}
.search-title{margin-top:8px;color:#f2f6f9;font:700 7px Sora}
.search-bars{margin-top:4px;display:grid;gap:3px}
.search-row{display:flex;align-items:center;gap:5px;font-size:6px;color:#b8d1d6}
.search-row span{width:10px;color:var(--neon);font-weight:800}
.bar{display:block;height:5px;border-radius:4px;background:linear-gradient(90deg,var(--neon),#4fc3ff);box-shadow:0 0 8px rgba(0,234,255,.5);transform-origin:left;animation:searchGrow 3.6s ease-in-out infinite alternate}
.bar-one{width:86%;animation-delay:0s}.bar-two{width:66%;animation-delay:.25s}.bar-three{width:49%;animation-delay:.5s}
.growth-footer{display:flex;align-items:center;gap:8px;margin-top:7px}
.growth-badge{white-space:nowrap;color:#04121a;background:var(--neon);border-radius:3px;padding:3px 5px;font-size:6px;font-weight:800;animation:badgePulse 2.8s ease-in-out infinite}
.growth-chart{height:23px;flex:1;border-bottom:1px solid rgba(0,234,255,.35);overflow:hidden}
.growth-chart svg{width:100%;height:100%;overflow:visible}.growth-chart path{fill:none;stroke:var(--neon);stroke-width:2;stroke-dasharray:320;stroke-dashoffset:320;animation:chartDraw 4s ease-in-out infinite alternate}
.count{animation:numberPulse 3.6s ease-in-out infinite alternate}.count-visits{animation-delay:.2s}.count-enquiries{animation-delay:.4s}
@keyframes searchGrow{0%{transform:scaleX(.55);opacity:.55}100%{transform:scaleX(1);opacity:1}}
@keyframes chartDraw{0%{stroke-dashoffset:320;opacity:.35}100%{stroke-dashoffset:0;opacity:1}}
@keyframes numberPulse{0%{opacity:.55;transform:translateY(2px)}100%{opacity:1;transform:translateY(0)}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 rgba(0,234,255,0)}50%{box-shadow:0 0 14px rgba(0,234,255,.8)}}
@media(prefers-reduced-motion:reduce){.growth-preview *{animation:none!important}.growth-chart path{stroke-dashoffset:0}.bar{transform:scaleX(1)}}
</style>
