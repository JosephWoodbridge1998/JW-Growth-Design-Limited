<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JW light theme preview</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff;color:#252b33}#bar{height:44px;box-sizing:border-box;padding:12px 16px;background:#edf5fa;font-size:14px}iframe{border:0;width:100%;height:calc(100% - 44px);display:block}</style></head><body><div id="bar">JW Growth &amp; Design — white &amp; blue preview. Live site unchanged.</div><iframe id="preview" src="./index.html" title="Light theme website preview"></iframe><script>const frame=document.getElementById('preview');frame.addEventListener('load',function(){try{const doc=frame.contentDocument;if(!doc||doc.getElementById('jw-preview-theme'))return;const link=doc.createElement('link');link.id='jw-preview-theme';link.rel='stylesheet';link.href=new URL('./jw-light-theme.css',location.href).href;doc.head.appendChild(link);}catch(e){document.getElementById('bar').textContent='Preview requires a same-origin web server; it cannot style external pages.';}});</script></body></html>
