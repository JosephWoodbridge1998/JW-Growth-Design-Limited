name: Validate retained homepage client bento
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate existing client sections without regenerating the homepage
        shell: python
        run: |
          from pathlib import Path
          source = Path('index.html').read_text()
          assert source.count('id="sinclair-bento"') == 1
          assert source.count('id="ember-client-homepage"') == 1
          for name in ['sinclair-desktop.png', 'sinclair-mobile.png', 'sinclair-logo.webp', 'sinclair-van.webp']:
              assert (Path('images/case-studies') / name).is_file(), name
          assert 'fictional café website concept—not a delivered client commission' not in source
          print('Retained Sinclair assets and Ember client section verified; no files changed.')
