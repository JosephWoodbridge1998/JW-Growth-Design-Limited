name: Apply approved company contact and copy update
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/company-contact-copy.py'
      - '.github/workflows/company-contact-copy.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: company-contact-copy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update source copy and generate audit
        run: python scripts/company-contact-copy.py
      - name: Commit the approved source changes
        run: |
          git add -- '*.html' '*.js' .github/company-contact-copy-audit.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Use company contact email and company-voice website copy'
            git push origin HEAD:main
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
