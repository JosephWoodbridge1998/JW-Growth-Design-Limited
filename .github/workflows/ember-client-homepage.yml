name: Replace Ember concept strip with client project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ember-client-homepage.yml'
      - 'scripts/ember-client-homepage.html'
permissions:
  contents: write
  pages: write
concurrency:
  group: ember-client-homepage
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only the concept strip
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          source = path.read_bytes().decode('utf-8')
          replacement = Path('scripts/ember-client-homepage.html').read_text().strip()
          marker = 'id="ember-client-homepage"'
          if marker not in source:
              pattern = r'<aside\b[^>]*class="sb-concept"[^>]*>[\s\S]*?</aside>'
              matches = list(re.finditer(pattern, source))
              assert len(matches) == 1, 'Expected exactly one concept strip; no change made'
              old = matches[0]
              assert 'Ember &amp; Grain' in old.group() and 'fictional' in old.group()
              result = source[:old.start()] + replacement + source[old.end():]
              assert result.count(marker) == 1
              assert result.count('id="sinclair-bento"') == source.count('id="sinclair-bento"') == 1
              assert result[:old.start()] == source[:old.start()]
              assert result.endswith(source[old.end():])
              path.write_bytes(result.encode('utf-8'))
          result = path.read_text()
          assert result.count(marker) == 1
          assert 'fictional café website concept—not a delivered client commission' not in result
          assert Path('case-studies/ember-and-grain.html').is_file()
      - name: Commit homepage only and verify remote main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- .github/workflows)"
          git add -- index.html
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --name-only)" = index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Replace homepage Ember concept strip with onboarded client bento'
            git push origin HEAD:main
          fi
          expected=$(git rev-parse HEAD)
          actual=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          test "$expected" = "$actual"
          echo "DEPLOY_COMMIT=$expected" >> "$GITHUB_ENV"
          echo "Remote main verified: $expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Request Pages rebuild and verify build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${{ github.repository }}/pages/builds > /tmp/pages-request.json
          build_url=$(jq -r '.url' /tmp/pages-request.json)
          test -n "$build_url"
          test "$build_url" != null
          for attempt in $(seq 1 40); do
            gh api "$build_url" > /tmp/pages-status.json
            status=$(jq -r '.status' /tmp/pages-status.json)
            commit=$(jq -r '.commit' /tmp/pages-status.json)
            if [ "$status" = built ]; then
              test "$commit" = "$DEPLOY_COMMIT"
              echo "Pages build succeeded for $commit" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$status" = errored ]; then
              cat /tmp/pages-status.json
              exit 1
            fi
            sleep 10
          done
          echo 'Pages build confirmation timed out' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Verify public homepage and case study
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location --max-time 25 "https://jwgrowthanddesign.com/?deployment=$DEPLOY_COMMIT" -o /tmp/homepage.html && grep -q 'id="ember-client-homepage"' /tmp/homepage.html && ! grep -q 'fictional café website concept—not a delivered client commission' /tmp/homepage.html; then
              curl --fail --silent --show-error --location --max-time 25 "https://jwgrowthanddesign.com/case-studies/ember-and-grain.html?deployment=$DEPLOY_COMMIT" -o /tmp/case-study.html
              grep -q 'New client onboarded' /tmp/case-study.html
              echo 'Public homepage replacement and case study verified.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Public homepage could not be verified; do not report deployment as successful.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
