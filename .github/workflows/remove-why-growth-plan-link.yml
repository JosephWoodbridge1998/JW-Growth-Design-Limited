name: Remove Why JW Growth Plan link
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-why-growth-plan-link.yml']
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove only the verified Growth Plan anchor
        shell: python
        run: |
          from pathlib import Path
          path = Path('why-jw-growth-design.html')
          source = path.read_bytes().decode('utf-8')
          anchor = '<a href="/services/Website-Growth.html">Explore the Growth Plan →</a>'
          assert source.count(anchor) == 1, 'Expected exactly one verified Growth Plan anchor; no changes made'
          before, after = source.split(anchor,1)
          updated = before + after
          assert before + anchor + after == source
          assert 'Explore the Growth Plan' not in updated
          assert 'Improvement after launch.' in updated
          assert 'jw-why-compact-globe' in updated
          assert '/jw-why-earth.js?v=20261111-compact-smooth' in updated
          path.write_bytes(updated.encode('utf-8'))
      - name: Commit only Why JW page and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- why-jw-growth-design.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove Growth Plan link from Why JW page'
          git push origin HEAD:main
          echo "Why JW link removal commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST repos/${{ github.repository }}/pages/builds
