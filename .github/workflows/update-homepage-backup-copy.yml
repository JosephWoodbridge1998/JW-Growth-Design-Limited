name: Update homepage backup wording
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/update-homepage-backup-copy.yml']
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only approved homepage backup copy
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('index.html')
          source = path.read_bytes().decode('utf-8')
          old = 'A documented backup schedule, retention period and recovery process.'
          new = 'Scheduled backups of your website’s files, code and digital assets to help restore your site quickly if an outage occurs.'
          if old not in source:
              assert source.count(new) == 1 and '>Website Backups<' in source, 'Expected backup copy not found; no changes made'
          else:
              assert source.count(old) == 1, 'Ambiguous backup description; no changes made'
              updated = source.replace(old,new,1)
              matches = list(re.finditer(r'(>\s*)Backups(\s*<)',updated))
              assert len(matches) == 1, 'Expected exactly one backup heading; no changes made'
              match = matches[0]
              start = match.start()+len(match.group(1))
              end = match.end()-len(match.group(2))
              updated = updated[:start]+'Website Backups'+updated[end:]
              restored = updated[:start]+'Backups'+updated[start+len('Website Backups'):]
              assert restored.replace(new,old,1) == source, 'Unrelated homepage changes detected'
              path.write_bytes(updated.encode('utf-8'))
      - name: Commit homepage copy change and request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- index.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Clarify homepage website backup service wording'
            git push origin HEAD:main
          fi
          echo "Homepage backup copy commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST repos/${{ github.repository }}/pages/builds
