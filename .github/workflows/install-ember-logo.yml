name: Install approved Ember and Grain logo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-ember-logo.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: install-ember-logo
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install logo and update only Ember branding
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib
          LOGO_DATA = ''
          EXPECTED_SHA256 = '1218c90122918e8584630773e16ad4f8a7fd7d2b780c98933654baf6eb856f22'
          ASSET = '/images/case-studies/ember-grain-logo.webp?v=20261111-willow-1'
          def replace_once(text, old, new):
              if new in text:
                  assert text.count(new) == 1, 'Duplicate logo markup'
                  return text
              assert text.count(old) == 1, 'Expected one logo target; no changes written'
              return text.replace(old, new, 1)
          home_path = Path('index.html')
          coffee_path = Path('showcases/coffee-shop/index.html')
          case_path = Path('case-studies/ember-and-grain.html')
          home = home_path.read_bytes().decode('utf-8')
          assert home.count('id="ember-client-homepage"') == 1
          before_ember = home.split('id="ember-client-homepage"', 1)[0]
          home = replace_once(home, '<div class="eg-wordmark">ember &amp; grain</div>', '<div class="eg-wordmark" style="background:#fff"><img src="'+ASSET+'" alt="Ember &amp; Grain willow tree and coffee cup logo" width="192" height="186" loading="lazy" style="display:block;width:100%;height:112px;object-fit:contain;padding:6px"></div>')
          home = replace_once(home, '<span class="eg-mark" aria-hidden="true">E&amp;G</span>', '<img src="'+ASSET+'" alt="Ember &amp; Grain logo" width="64" height="64" loading="lazy">')
          assert home.split('id="ember-client-homepage"', 1)[0] == before_ember, 'Unrelated homepage content changed'
          coffee = coffee_path.read_bytes().decode('utf-8')
          for caption, width, height in [('COFFEE · KITCHEN · COMPANY',128,96), ('A FICTIONAL CAFÉ BY JW',160,150)]:
              old = 'ember <i>&amp;</i> grain<span>'+caption+'</span>'
              new = '<img src="'+ASSET+'" alt="Ember &amp; Grain willow tree and coffee cup logo" width="'+str(width)+'" height="'+str(height)+'" style="display:block;width:'+str(width)+'px;height:'+str(height)+'px;object-fit:contain;background:#fff;border-radius:6px"><span>'+caption+'</span>'
              coffee = replace_once(coffee, old, new)
          case = case_path.read_bytes().decode('utf-8')
          case = replace_once(case, '<h1>Ember &amp; Grain</h1>', '<img id="eg-case-logo" src="'+ASSET+'" alt="Ember &amp; Grain willow tree and coffee cup logo" width="192" height="186" style="display:block;width:160px;max-width:100%;height:auto;background:#fff;border-radius:12px;padding:8px;margin:18px 0"><h1>Ember &amp; Grain</h1>')
          data = base64.b64decode(LOGO_DATA, validate=True)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
          assert hashlib.sha256(data).hexdigest() == EXPECTED_SHA256
          assert home.count(ASSET) == 2 and coffee.count(ASSET) == 2 and case.count(ASSET) == 1
          asset_path = Path('images/case-studies/ember-grain-logo.webp')
          asset_path.parent.mkdir(parents=True, exist_ok=True)
          asset_path.write_bytes(data)
          for path, content in [(home_path, home), (coffee_path, coffee), (case_path, case)]:
              path.write_bytes(content.encode('utf-8'))
      - name: Commit scoped branding changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- index.html showcases/coffee-shop/index.html case-studies/ember-and-grain.html images/case-studies/ember-grain-logo.webp
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Install approved Ember and Grain willow coffee logo across case study and previews'
            git push origin HEAD:main
          fi
          expected=$(git rev-parse HEAD)
          actual=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha')
          test "$expected" = "$actual"
          echo "DEPLOY_COMMIT=$expected" >> "$GITHUB_ENV"
          echo "Branding commit: $expected" >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild Pages and verify deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/${{ github.repository }}/pages/builds > /tmp/ember-pages-request.json
          build_url=$(jq -r '.url' /tmp/ember-pages-request.json)
          test -n "$build_url"
          test "$build_url" != null
          for attempt in $(seq 1 40); do
            gh api "$build_url" > /tmp/ember-pages-status.json
            status=$(jq -r '.status' /tmp/ember-pages-status.json)
            if [ "$status" = built ]; then
              test "$(jq -r '.commit' /tmp/ember-pages-status.json)" = "$DEPLOY_COMMIT"
              exit 0
            fi
            if [ "$status" = errored ]; then cat /tmp/ember-pages-status.json; exit 1; fi
            sleep 10
          done
          echo 'Pages rebuild not confirmed' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Verify public logo and page markup
        run: |
          set -euo pipefail
          for path in '' 'showcases/coffee-shop/' 'case-studies/ember-and-grain.html'; do
            curl --fail --silent --show-error --location --retry 4 --max-time 25 "https://jwgrowthanddesign.com/$path?deployment=$DEPLOY_COMMIT" -o /tmp/ember-public.html
            grep -q '/images/case-studies/ember-grain-logo.webp?v=20261111-willow-1' /tmp/ember-public.html
          done
          curl --fail --silent --show-error --location --retry 4 --max-time 25 "https://jwgrowthanddesign.com/images/case-studies/ember-grain-logo.webp?deployment=$DEPLOY_COMMIT" -o /tmp/ember-public.webp
          echo '1218c90122918e8584630773e16ad4f8a7fd7d2b780c98933654baf6eb856f22  /tmp/ember-public.webp' | sha256sum --check
          echo 'Public logo bytes and homepage, cafe preview and full case-study markup verified. Browser rendering not checked.' >> "$GITHUB_STEP_SUMMARY"
