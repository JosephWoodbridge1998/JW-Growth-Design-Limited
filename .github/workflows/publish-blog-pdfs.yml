name: Publish logo-branded blog PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blog/sources/**'
      - 'scripts/build-blog-pdfs.py'
      - '.github/workflows/publish-blog-pdfs.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: jw-blog-pdf-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read existing Pages publishing mode
        id: pages
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/jw-pages.json
          mode=$(python -c 'import json; print(json.load(open("/tmp/jw-pages.json"))["build_type"])')
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/jw-pages.json'))
          assert data['build_type'] in ('legacy','workflow')
          if data['build_type']=='legacy':
              assert data['source']['branch']=='main' and data['source']['path']=='/', 'Pages source is not main root; stop for review'
          PY
      - name: Install PDF and logo capture dependencies
        run: |
          python -m pip install reportlab pypdf pillow playwright
          python -m playwright install --with-deps chromium
      - name: Capture the full existing website logo
        run: |
          mkdir -p .build
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/jw-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlparse
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1600,'height':1000},device_scale_factor=3)
              allowed={'127.0.0.1','fonts.googleapis.com','fonts.gstatic.com'}
              page.route('**/*',lambda route: route.continue_() if urlparse(route.request.url).hostname in allowed else route.abort())
              page.goto('http://127.0.0.1:8765/index.html',wait_until='domcontentloaded')
              page.evaluate('document.fonts.ready')
              page.add_style_tag(content='.brand .mark::before{animation:none!important}')
              logo=page.locator('header .brand').first
              assert logo.is_visible()
              logo.screenshot(path='.build/jw-logo.png',animations='disabled')
              browser.close()
          PY
      - name: Build and validate five PDFs, then activate blog cards
        run: python scripts/build-blog-pdfs.py
      - name: Commit PDFs and blog page to main
        run: |
          git add blog.html blog/*.pdf
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish five validated logo-branded PDF guides and blog cards'
            git push origin HEAD:main
          fi
      - name: Build existing branch-based Pages site
        if: steps.pages.outputs.mode == 'legacy'
        run: |
          build_url=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.url')
          for attempt in $(seq 1 60); do
            status=$(gh api "$build_url" --jq '.status')
            if [ "$status" = built ]; then exit 0; fi
            if [ "$status" = errored ]; then gh api "$build_url"; exit 1; fi
            sleep 5
          done
          echo 'Pages build timed out'; exit 1
      - name: Stage existing Actions-based Pages site
        if: steps.pages.outputs.mode == 'workflow'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,shutil
          for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
              if not name or name.startswith(('.github/','scripts/','blog/sources/')): continue
              source=Path(name)
              if source.is_file():
                  dest=Path('.site')/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(source,dest)
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.mode == 'workflow'
        with:
          path: .site
      - uses: actions/deploy-pages@v4
        if: steps.pages.outputs.mode == 'workflow'
