name: Replace handyman room photos
on:
  push:
    branches: ['preview/smart-handyman-4u']
    paths: ['.github/workflows/handyman-real-photos.yml']
permissions:
  contents: write
jobs:
  photos:
    if: github.ref == 'refs/heads/preview/smart-handyman-4u'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/smart-handyman-4u
      - name: Save supplied photos and replace old room imagery
        shell: python
        run: |
          from pathlib import Path
          import base64,re
          photos={
          'loft-bedroom':'',
          'room-renovation':'',
          'decorating-detail':''}
          folder=Path('images/smart-handyman');folder.mkdir(parents=True,exist_ok=True)
          for name,data in photos.items():
              raw=base64.b64decode(data,validate=True)
              assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'
              (folder/(name+'.webp')).write_bytes(raw)
          path=Path('index.html');text=path.read_text()
          assert 'Smart Handyman 4u' in text and 'tel:07438553005' in text
          old=r'<figure class="hero-art" id="work">.*?</figure>'
          assert len(re.findall(old,text,re.S))==1,'Expected one old room collage'
          hero='<figure class="hero-art"><img src="/images/smart-handyman/loft-bedroom.webp" alt="Loft bedroom with white walls, skylights and fitted storage" width="240" height="182"><figcaption><p>Project photograph supplied for this website preview.</p></figcaption></figure>'
          text=re.sub(old,lambda m:hero,text,flags=re.S)
          captions=[('loft-bedroom','Loft bedroom'),('room-renovation','Room refurbishment in progress'),('decorating-detail','Decorating detail')]
          gallery='<section class="section" id="work"><p class="eyebrow">Project photographs</p><h2>A closer look at the work.</h2><div class="real-project-grid">'
          for name,caption in captions:
              src='/images/smart-handyman/'+name+'.webp'
              gallery+=f'<figure><a href="{src}" target="_blank" rel="noopener"><img src="{src}" alt="{caption}" loading="lazy"></a><figcaption>{caption}</figcaption></figure>'
          gallery+='</div></section>'
          marker='<section class="section" id="services">';assert text.count(marker)==1
          text=text.replace(marker,gallery+marker)
          css='<style>.real-project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.real-project-grid figure{margin:0;padding:14px;background:#18232c;border:1px solid #334650;border-radius:14px}.real-project-grid img{display:block;width:100%;height:280px;object-fit:contain;background:#10171d;border-radius:8px}.real-project-grid figcaption{font-size:13px;color:#b9c7d0;margin-top:12px}@media(max-width:700px){.real-project-grid{grid-template-columns:1fr}.real-project-grid img{height:auto;max-height:480px;object-fit:contain}}</style>'
          text=text.replace('</head>',css+'</head>')
          assert 'Four decorating project photographs' not in text
          assert 'Preview-quality crops.' not in text
          assert len(re.findall('data:image/webp;base64,',text))==2,'Both original logos must remain; all room photos must use the supplied replacements'
          assert all('/images/smart-handyman/'+name+'.webp' in text for name in photos)
          path.write_text(text)
      - name: Commit only the preview page and its three photos
        run: |
          set -euo pipefail
          test "${{ github.ref_name }}" = 'preview/smart-handyman-4u'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html images/smart-handyman
          git commit -m 'Replace handyman room collage with three supplied project photographs'
          git push origin HEAD:preview/smart-handyman-4u
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
