<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JW real website portfolio</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#19394c;font-family:Arial,sans-serif}body{padding:24px 4% 10px}.devices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.19fr);gap:7%;align-items:end}.laptop{min-width:0;position:relative;padding-bottom:10px}.bezel{position:relative;border:8px solid #252930;border-bottom-width:11px;border-radius:12px 12px 4px 4px;background:#111;aspect-ratio:1440/936;box-shadow:0 18px 26px #17394c26;overflow:hidden}.camera{position:absolute;top:2px;left:50%;width:4px;height:4px;border-radius:50%;background:#555;z-index:9}.base{position:absolute;bottom:0;left:-4%;width:108%;height:10px;background:linear-gradient(#b3b7bf,#737981);border-radius:2px 2px 10px 10px}.base:after{content:'';display:block;width:18%;height:3px;background:#626972;margin:auto;border-radius:0 0 4px 4px}.screen{position:absolute;inset:0;overflow:hidden;background:#13232e}.track{position:absolute;inset:0 auto 0 0;width:300%;display:flex}.panel{position:relative;flex:0 0 33.333333%;height:100%;overflow:hidden;background:#13232e}.web{position:absolute;left:0;top:0;width:1440px;height:936px;border:0;transform:scale(var(--scale,1));transform-origin:0 0;pointer-events:none}.status{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;padding:15px;background:#13232e;color:white;font-size:12px;line-height:1.6}.panel.ready .status{display:none}.phone{position:relative;border:4px solid #292e35;border-radius:17px;aspect-ratio:390/844;background:#111;overflow:hidden;box-shadow:0 12px 24px #17394c26;margin-bottom:10px}.phone iframe{position:absolute;inset:0;width:390px;height:844px;transform-origin:0 0;transform:scale(var(--mobile-scale,1));border:0;pointer-events:none}.phone:after{content:'';position:absolute;top:4px;left:30%;width:40%;height:6px;background:#292e35;border-radius:4px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:17px;font-size:11px;line-height:1.5}.caption{flex:1 1 100%;min-height:33px}.controls button,.controls a{font:inherit;min-height:34px;border:1px solid #9db8c9;border-radius:5px;padding:7px 10px;background:#fff;color:#175775;text-decoration:none;cursor:pointer}.controls button:focus-visible,.controls a:focus-visible{outline:3px solid #176b96;outline-offset:2px}.note{font-size:10px;color:#647684;line-height:1.5;margin:10px 0}.cursor{position:absolute;left:12%;top:20%;z-index:5;width:13px;height:19px;background:white;clip-path:polygon(0 0,0 100%,30% 73%,54% 100%,73% 90%,48% 64%,88% 64%);filter:drop-shadow(0 0 2px black);opacity:0}.chat{position:absolute;inset:6% 5%;z-index:6;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:#eae6dd;color:#152628;font-size:clamp(8px,1.7vw,14px);box-shadow:0 10px 30px #0005}.chat[hidden]{display:none}.chat-head{background:#075e54;color:white;padding:10px;display:flex;justify-content:space-between}.chat-head small{font-size:.75em;display:block;margin-top:3px}.chat-body{flex:1;padding:12% 8%;background:radial-gradient(#d2cfc6 .7px,transparent .7px);background-size:13px 13px}.bubble{background:#d9fdd3;margin-left:auto;max-width:95%;padding:9px;border-radius:7px;line-height:1.5;min-height:34px}.chat-foot{padding:7px;background:#fff;font-size:.8em;color:#4b635e}.flash{position:absolute;width:28px;height:28px;border:2px solid #25d366;border-radius:50%;z-index:4;opacity:0;transform:translate(-50%,-50%)}@media(max-width:450px){body{padding:12px 4% 6px}.bezel{border-width:5px;border-bottom-width:7px}.phone{border-width:3px;border-radius:12px}.controls{font-size:10px;gap:5px;margin-top:12px}.note{font-size:9px}}
</style></head><body><div class="devices"><div class="laptop"><div class="bezel"><span class="camera"></span><div class="screen" id="screen"><div class="track" id="track"></div><div class="flash" id="flash" aria-hidden="true"></div><div class="cursor" id="cursor" aria-hidden="true"></div><div class="chat" id="chat" hidden aria-hidden="true"><div class="chat-head"><span>WhatsApp<small>KZ Disposals · demonstration</small></span><span>×</span></div><div class="chat-body"><div class="bubble" id="message"></div></div><div class="chat-foot">Simulated quote request. No message is sent.</div></div></div></div><div class="base"></div></div><div class="phone" id="phone" aria-hidden="true"><iframe title="Sinclair’s responsive website preview" tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://www.sinclairslandscapingandgardeningservices.co.uk/"></iframe></div></div><div class="controls"><span class="caption" id="caption"></span><button type="button" id="pause">Pause</button><button type="button" id="next">Next website</button><a id="visit" target="_blank" rel="noopener noreferrer">View website ↗</a></div><p class="note">Real website previews. Concept designs are labelled. Phone motion will be developed separately.</p><script>
(()=>{'use strict';const screen=document.getElementById('screen'),track=document.getElementById('track'),phone=document.getElementById('phone'),caption=document.getElementById('caption'),visit=document.getElementById('visit'),button=document.getElementById('pause'),cursor=document.getElementById('cursor'),flash=document.getElementById('flash'),chat=document.getElementById('chat'),message=document.getElementById('message');const reduce=matchMedia('(prefers-reduced-motion: reduce)');let paused=reduce.matches,current=0,token=0,last=0;const sites=[{name:'Sinclair’s Landscape & Gardening Services',label:'Delivered website',url:'https://www.sinclairslandscapingandgardeningservices.co.uk/',link:'https://www.sinclairslandscapingandgardeningservices.co.uk/'},{name:'Butcher Barber',label:'Design concept',url:'https://josephwoodbridge1998.github.io/Butcher-Barber/jw-showcase.html',link:'https://josephwoodbridge1998.github.io/Butcher-Barber/'},{name:'KZ Disposals',label:'Independent design concept — not an official client website',url:'https://josephwoodbridge1998.github.io/KZ-Disposals/jw-showcase.html',link:'https://josephwoodbridge1998.github.io/KZ-Disposals/'}];function send(i,action){const s=sites[i];if(i&&s.frame)s.frame.contentWindow?.postMessage({channel:'jw-showcase-v1',action},new URL(s.url).origin)}sites.forEach((s,i)=>{const panel=document.createElement('div');panel.className='panel';const status=document.createElement('div');status.className='status';status.textContent='Loading '+s.name+'…';const frame=document.createElement('iframe');frame.className='web';frame.title=s.name+' — '+s.label;frame.tabIndex=-1;frame.setAttribute('aria-hidden','true');frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.referrerPolicy='no-referrer';s.frame=frame;s.panel=panel;s.status=status;s.ready=false;s.done=false;frame.addEventListener('load',()=>{if(i)send(i,'hello');else{panel.classList.add('ready');s.ready=true}});frame.src=s.url;panel.append(frame,status);track.append(panel)});function resize(){screen.style.setProperty('--scale',String(screen.clientWidth/1440));phone.style.setProperty('--mobile-scale',String(phone.clientWidth/390))}new ResizeObserver(resize).observe(screen);new ResizeObserver(resize).observe(phone);resize();function label(){caption.textContent=sites[current].name+' · '+sites[current].label;visit.href=sites[current].link;button.textContent=paused?'Play':'Pause';button.setAttribute('aria-pressed',String(paused))}function sync(){last=0;sites.forEach((s,i)=>{if(i&&s.ready)send(i,paused||document.hidden?'pause':'resume')});document.getAnimations().forEach(a=>paused||document.hidden?a.pause():a.play());label()}function wait(ms,t){return new Promise(resolve=>{let elapsed=0,previous=0;function tick(now){if(t!==token){resolve(false);return}if(!paused&&!document.hidden){elapsed+=previous?Math.min(now-previous,100):0;previous=now}else previous=0;if(elapsed>=ms)resolve(true);else requestAnimationFrame(tick)}requestAnimationFrame(tick)})}async function until(check,limit,t){for(let n=0;n<limit;n+=100){if(check())return true;if(!await wait(100,t))return false}return check()}window.addEventListener('message',e=>{const i=sites.findIndex(s=>s.frame.contentWindow===e.source);if(i<1||e.origin!==new URL(sites[i].url).origin||e.data?.channel!=='jw-showcase-v1')return;const s=sites[i],d=e.data;if(d.type==='ready'){s.ready=true;s.panel.classList.add('ready');send(i,paused||document.hidden?'pause':'resume')}else if(d.type==='scrolled')s.done=true;else if(d.type==='error'){s.ready=false;s.status.textContent='Preview unavailable. Use View website.';s.panel.classList.remove('ready')}else if(d.type==='button'&&i===2&&current===2&&d.bounds){const b=d.bounds;if([b.x,b.y,b.width,b.height].every(Number.isFinite)&&b.width>0&&b.height>0)s.point={x:Math.max(0,Math.min(100,100*b.x/b.width)),y:Math.max(0,Math.min(100,100*b.y/b.height))}}});async function show(i,t){current=i;chat.hidden=true;message.textContent='';cursor.style.opacity='0';flash.style.opacity='0';sites.forEach((s,j)=>{if(j&&s.ready)send(j,'pause')});const from=track.style.transform||'translateX(0%)',to='translateX('+(-i*100/3)+'%)';track.style.transform=to;if(!reduce.matches){const a=track.animate([{transform:from},{transform:to}],{duration:700,easing:'cubic-bezier(.22,1,.36,1)'});if(paused)a.pause()}label();if(i){send(i,'hello');await until(()=>sites[i].ready,15000,t);if(t!==token)return false;if(!sites[i].ready){sites[i].status.textContent='Preview unavailable. Use View website.';return true}send(i,'reset');if(paused)send(i,'pause')}return await wait(800,t)}async function scroll(i,action,t){if(!sites[i].ready)return;sites[i].done=false;send(i,action);await until(()=>sites[i].done,8000,t)}async function cycle(t,start=0){let i=start;while(t===token){if(!await show(i,t))return;if(!await wait(i===0?4000:2200,t))return;if(i===1&&sites[i].ready){await scroll(i,'section',t);if(!await wait(1000,t))return;await scroll(i,'detail',t);if(!await wait(1200,t))return}if(i===2&&sites[i].ready){await scroll(i,'section',t);if(!await wait(900,t))return;sites[i].point=null;send(i,'button');await until(()=>sites[i].point,2000,t);if(t!==token)return;const p=sites[i].point;if(p){cursor.style.opacity='1';const a=cursor.animate([{left:'12%',top:'20%'},{left:p.x+'%',top:p.y+'%'}],{duration:700,fill:'forwards',easing:'ease'});if(paused)a.pause();if(!await wait(900,t))return;flash.style.left=p.x+'%';flash.style.top=p.y+'%';flash.animate([{opacity:1,scale:.5},{opacity:0,scale:1.6}],{duration:450});if(!await wait(450,t))return;cursor.style.opacity='0';a.cancel();chat.hidden=false;const text='Hi, could I get a quote for rubbish clearance please?';for(let n=1;n<=text.length;n++){if(!await wait(45,t))return;message.textContent=text.slice(0,n)}if(!await wait(3200,t))return}}i=(i+1)%3}}button.onclick=()=>{paused=!paused;sync()};document.getElementById('next').onclick=()=>{token++;paused=false;sync();cycle(token,(current+1)%3)};document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',()=>{if(reduce.matches){paused=true;sync()}});const hello=setInterval(()=>sites.forEach((s,i)=>{if(i&&!s.ready)send(i,'hello')}),2000);setTimeout(()=>clearInterval(hello),60000);label();cycle(token);
})();
</script></body></html>
