<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>JW real website portfolio</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#19394c;font-family:Arial,sans-serif}body{padding:24px 4% 10px;pointer-events:none}.devices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.19fr);gap:7%;align-items:end}.laptop{min-width:0;position:relative;padding-bottom:10px}.bezel{position:relative;border:8px solid #252930;border-bottom-width:11px;border-radius:12px 12px 4px 4px;background:#111;aspect-ratio:1440/936;box-shadow:0 18px 26px #17394c26;overflow:hidden}.camera{position:absolute;top:2px;left:50%;width:4px;height:4px;border-radius:50%;background:#555;z-index:9}.base{position:absolute;bottom:0;left:-4%;width:108%;height:10px;background:linear-gradient(#b3b7bf,#737981);border-radius:2px 2px 10px 10px}.base:after{content:'';display:block;width:18%;height:3px;background:#626972;margin:auto;border-radius:0 0 4px 4px}.screen{position:absolute;inset:0;overflow:hidden;background:#13232e}.track{position:absolute;inset:0 auto 0 0;width:400%;display:flex}.panel{position:relative;flex:0 0 25%;height:100%;overflow:hidden;background:#13232e}.web{position:absolute;left:0;top:0;width:1440px;height:936px;border:0;transform:scale(var(--scale,1));transform-origin:0 0;pointer-events:none}.status{position:absolute;inset:0;z-index:2;display:grid;place-content:center;text-align:center;padding:15px;background:#13232e;color:white;font-size:12px;line-height:1.6}.panel.ready .status{display:none}.phone{position:relative;border:4px solid #292e35;border-radius:17px;aspect-ratio:390/844;background:#111;overflow:hidden;box-shadow:0 12px 24px #17394c26;margin-bottom:10px}.phone iframe{position:absolute;inset:0;width:390px;height:844px;transform-origin:0 0;transform:scale(var(--mobile-scale,1));border:0;pointer-events:none}.phone:after{content:'';position:absolute;top:4px;left:30%;width:40%;height:6px;background:#292e35;border-radius:4px}.cursor{position:absolute;left:12%;top:20%;z-index:5;width:13px;height:19px;background:white;clip-path:polygon(0 0,0 1 </style></head><body><div class="devices" role="img" aria-label="Automated showcase of website designs by JW Growth and Design, including independent concepts."><div class="laptop"><div class="bezel"><span class="camera"></span><div class="screen" id="screen"><div class="track" id="track"></div><div class="flash" id="flash" aria-hidden="true"></div><div class="cursor" id="cursor" aria-hidden="true"></div><div class="chat" id="chat" hidden aria-hidden="true"><div class="chat-head"><span>WhatsApp<small>KZ Disposals · demonstration</small></span><span>×</span></div><div class="chat-body"><div class="bubble" id="message"></div></div><div class="chat-foot">Simulated quote request. No message is sent.</div></div></div></div><div class="base"></div></div><div class="phone" id="phone" aria-hidden="true"><iframe title="Sinclair’s responsive website preview" tabindex="-1" sandbox="allow-scripts allow-same-origin" src="https://www.sinclairslandscapingandgardeningservices.co.uk/"></iframe></div></div><script>
(()=>{'use strict';const screen=document.getElementById('screen'),track=document.getElementById('track'),phone=document.getElementById('phone'),cursor=document.getElementById('cursor'),flash=document.getElementById('flash'),chat=document.getElementById('chat'),message=document.getElementById('message');const reduce=matchMedia('(prefers-reduced-motion: reduce)');let paused=reduce.matches,current=0,token=0,cursorMove=null;const sites=[{name:'Sinclair’s Landscape & Gardening Services',label:'Delivered website',url:'https://www.sinclairslandscapingandgardeningservices.co.uk/'},{name:'Butcher Barber',label:'Design concept',remote:true,url:'https://josephwoodbridge1998.github.io/Butcher-Barber/jw-showcase.html'},{name:'KZ Disposals',label:'Independent design concept',remote:true,url:'https://josephwoodbridge1998.github.io/KZ-Disposals/jw-showcase.html'},{name:'WomenActiveWear',label:'Independent retail design concept',local:true,url:new URL('./showcases/womenactivewear/index.html',location.href).href}];track.style.width=sites.length*100+'%';function send(i,action){const s=sites[i];if(s.remote&&s.frame)s.frame.contentWindow?.postMessage({channel:'jw-showcase-v1',action},new URL(s.url).origin)}function fail(s){s.ready=false;s.status.textContent='Website preview unavailable.';s.panel.classList.remove('ready')}sites.forEach((s,i)=>{const panel=document.createElement('div');panel.className='panel';panel.style.flexBasis=100/sites.length+'%';const status=document.createElement('div');status.className='status';status.textContent='Loading website preview…';const frame=document.createElement('iframe');frame.className='web';frame.title=s.name+' — '+s.label;frame.tabIndex=-1;frame.setAttribute('aria-hidden','true');frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.referrerPolicy='no-referrer';s.frame=frame;s.panel=panel;s.status=status;s.ready=false;s.done=false;frame.addEventListener('load',()=>{if(s.remote){send(i,'hello');return}if(s.local){try{const d=frame.contentDocument;if(!d?.getElementById('products')||!d.getElementById('bag-dialog'))throw Error('Wrong document');const css=d.createElement('style');css.textContent='html{scroll-behavior:auto!important;scrollbar-width:none}::-webkit-scrollbar{display:none}';d.head.append(css);d.addEventListener('submit',e=>e.preventDefault(),true);d.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&!a.getAttribute('href')?.startsWith('#'))e.preventDefault()},true)}catch(error){fail(s);return}}panel.classList.add('ready');s.ready=true});frame.src=s.url;panel.append(frame,status);track.append(panel)});function resize(){screen.style.setProperty('--scale',String(screen.clientWidth/1440));phone.style.setProperty('--mobile-scale',String(phone.clientWidth/390))}new ResizeObserver(resize).observe(screen);new ResizeObserver(resize).observe(phone);resize();function sync(){sites.forEach((s,i)=>{if(s.remote&&s.ready)send(i,paused||document.hidden?'pause':'resume')});document.getAnimations().forEach(a=>paused||document.hidden?a.pause():a.play())}function wait(ms,t){return new Promise(resolve=>{let elapsed=0,previous=0;function tick(now){if(t!==token){resolve(false);return}if(!paused&&!document.hidden){elapsed+=previous?Math.min(now-previous,100):0;previous=now}else previous=0;if(elapsed>=ms)resolve(true);else requestAnimationFrame(tick)}requestAnimationFrame(tick)})}async function until(check,limit,t){for(let n=0;n<limit;n+=100){if(check())return true;if(!await wait(100,t))return false}return check()}window.addEventListener('message',e=>{const i=sites.findIndex(s=>s.frame.contentWindow===e.source);if(i<0||!sites[i].remote||e.origin!==new URL(sites[i].url).origin||e.data?.channel!=='jw-showcase-v1')return;const s=sites[i],d=e.data;if(d.type==='ready'){s.ready=true;s.panel.classList.add('ready');send(i,paused||document.hidden?'pause':'resume')}else if(d.type==='scrolled')s.done=true;else if(d.type==='error')fail(s);else if(d.type==='button'&&i===2&&current===2&&d.bounds){const b=d.bounds;if([b.x,b.y,b.width,b.height].every(Number.isFinite)&&b.width>0&&b.height>0)s.point={x:Math.max(0,Math.min(100,100*b.x/b.width)),y:Math.max(0,Math.min(100,100*b.y/b.height))}}});function resetLocal(s){const d=s.frame.contentDocument;d.querySelectorAll('dialog[open]').forEach(x=>x.close());let remove;while((remove=d.querySelector('[data-remove]')))remove.click();d.getElementById('clear-filters')?.click();d.body.style.overflow='';s.frame.contentWindow.scrollTo(0,0)}async function show(i,t){current=i;chat.hidden=true;message.textContent='';cursor.style.opacity='0';flash.style.opacity='0';if(cursorMove){cursorMove.cancel();cursorMove=null}sites.forEach((s,j)=>{if(s.remote&&s.ready)send(j,'pause')});const from=track.style.transform||'translateX(0%)',to='translateX('+(-i*100/sites.length)+'%)';track.style.transform=to;if(!reduce.matches){const a=track.animate([{transform:from},{transform:to}],{duration:700,easing:'cubic-bezier(.22,1,.36,1)'});if(paused)a.pause()}if(sites[i].remote||sites[i].local){send(i,'hello');await until(()=>sites[i].ready,15000,t);if(t!==token)return false;if(!sites[i].ready){sites[i].status.textContent='Website preview unavailable.';return true}if(sites[i].local){try{resetLocal(sites[i])}catch(error){fail(sites[i])}}else{send(i,'reset');if(paused)send(i,'pause')}}return await wait(800,t)}async function scroll(i,action,t){if(!sites[i].ready)return;sites[i].done=false;send(i,action);await until(()=>sites[i].done,8000,t)}async function localScroll(s,t){const w=s.frame.contentWindow,d=s.frame.contentDocument,target=d.getElementById('shop');if(!target)return false;const from=w.scrollY,max=Math.max(0,d.documentElement.scrollHeight-w.innerHeight),to=Math.max(0,Math.min(max,target.getBoundingClientRect().top+from-(d.querySelector('.header')?.offsetHeight||0)-12));return new Promise(resolve=>{let previous=0,elapsed=0;function tick(now){if(t!==token){resolve(false);return}if(!paused&&!document.hidden){elapsed+=previous?Math.min(now-previous,100):0;previous=now;const p=Math.min(1,elapsed/1200);w.scrollTo(0,from+(to-from)*(1-Math.pow(1-p,3)))}else previous=0;if(elapsed>=1200)resolve(true);else requestAnimationFrame(tick)}requestAnimationFrame(tick)})}async function pointAndClick(s,el,t){if(!el)return false;const r=el.getBoundingClientRect(),w=s.frame.contentWindow,x=(r.left+r.width/2)/w.innerWidth*100,y=(r.top+r.height/2)/w.innerHeight*100;if(x<0||x>100||y<0||y>100)return false;const fromLeft=cursor.style.left||'12%',fromTop=cursor.style.top||'20%';cursor.style.opacity='1';if(cursorMove){cursorMove.cancel();cursorMove=null}cursor.style.left=x+'%';cursor.style.top=y+'%';cursorMove=cursor.animate([{left:fromLeft,top:fromTop},{left:x+'%',top:y+'%'}],{duration:550,easing:'ease'});if(paused)cursorMove.pause();if(!await wait(650,t))return false;flash.style.left=x+'%';flash.style.top=y+'%';flash.animate([{opacity:1,scale:.5},{opacity:0,scale:1.5}],{duration:350});el.click();return await wait(400,t)}async function activewear(t){const s=sites[3];if(!s.ready)return;try{const d=s.frame.contentDocument,w=s.frame.contentWindow;if(!await localScroll(s,t))return;if(!await wait(800,t))return;await pointAndClick(s,d.querySelector('[data-filter="Leggings"]'),t);if(!await wait(1100,t))return;const chosen=d.querySelector('#products .choose');if(!await pointAndClick(s,chosen,t))return;if(!await wait(1100,t))return;const size=d.getElementById('product-size');if(!size)return;await pointAndClick(s,size,t);if(t!==token)return;size.value=Array.from(size.options).some(o=>o.value==='M')?'M':size.options[1]?.value||'';size.dispatchEvent(new w.Event('change',{bubbles:true}));if(!await wait(700,t))return;await pointAndClick(s,d.getElementById('add-to-bag'),t);if(!await wait(900,t))return;await pointAndClick(s,d.getElementById('bag-open'),t);cursor.style.opacity='0';await wait(2500,t)}catch(error){console.warn('Activewear demonstration skipped',error)}}async function cycle(t,start=0){let i=start;while(t===token){if(!await show(i,t))return;if(!await wait(i===0?4000:2200,t))return;if(i===1&&sites[i].ready){await scroll(i,'section',t);if(!await wait(1000,t))return;await scroll(i,'detail',t);if(!await wait(1200,t))return}if(i===2&&sites[i].ready){await scroll(i,'section',t);if(!await wait(900,t))return;sites[i].point=null;send(i,'button');await until(()=>sites[i].point,2000,t);if(t!==token)return;const p=sites[i].point;if(p){cursor.style.opacity='1';const a=cursor.animate([{left:'12%',top:'20%'},{left:p.x+'%',top:p.y+'%'}],{duration:700,fill:'forwards',easing:'ease'});if(paused)a.pause();if(!await wait(900,t))return;flash.style.left=p.x+'%';flash.style.top=p.y+'%';flash.animate([{opacity:1,scale:.5},{opacity:0,scale:1.6}],{duration:450});if(!await wait(450,t))return;cursor.style.opacity='0';a.cancel();chat.hidden=false;const text='Hi, could I get a quote for rubbish clearance please?';for(let n=1;n<=text.length;n++){if(!await wait(45,t))return;message.textContent=text.slice(0,n)}if(!await wait(3200,t))return}}if(i===3)await activewear(t);i=(i+1)%sites.length}}document.addEventListener('visibilitychange',sync);reduce.addEventListener('change',()=>{paused=reduce.matches;sync()});const hello=setInterval(()=>sites.forEach((s,i)=>{if(s.remote&&!s.ready)send(i,'hello')}),2000);setTimeout(()=>clearInterval(hello),60000);cycle(token);
})();
